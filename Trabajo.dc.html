  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ottom:1px solid #E9EEEB;\">\n            <span style=\"font-size:14.5px; color:#69727B; font-weight:600;\">Cliente<\u002Fspan>\n            <span style=\"font-size:14.5px; color:#14181C; font-weight:700; text-align:right;\">{{ client }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid #E9EEEB;\">\n            <span style=\"font-size:14.5px; color:#69727B; font-weight:600;\">Servicio<\u002Fspan>\n            <span style=\"font-size:14.5px; color:#14181C; font-weight:700; text-align:right;\">{{ category }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid #E9EEEB;\">\n            <span style=\"font-size:14.5px; color:#69727B; font-weight:600;\">Ubicación<\u002Fspan>\n            <span style=\"font-size:14.5px; color:#14181C; font-weight:700; text-align:right;\">{{ location }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:14px 0;\">\n            <span style=\"font-size:14.5px; color:#69727B; font-weight:600;\">Año<\u002Fspan>\n            <span style=\"font-size:14.5px; color:#14181C; font-weight:700; text-align:right;\">{{ year }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"ESIM%20SRL.dc.html#contacto\" style=\"display:block; text-align:center; margin-top:22px; background:#0E7A3A; color:#fff; text-decoration:none; font-weight:700; font-size:15px; padding:14px; border-radius:11px;\" style-hover=\"background:#0A5E2D;\">Consultar un trabajo similar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#F6F8F7; padding:30px 6vw 90px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <p style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:#0E7A3A; margin:0 0 24px;\">GALERÍA DEL PROYECTO<\u002Fp>\n      <div class=\"esim-gallery\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px;\">\n        <sc-for list=\"{{ images }}\" as=\"img\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ img.open }}\" style=\"position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden; cursor:zoom-in; background:#1B2026; box-shadow:0 8px 24px rgba(20,24,28,0.08);\" style-hover=\"box-shadow:0 14px 34px rgba(20,24,28,0.18);\">\n            {{ img.el }}\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff; padding:0 6vw 90px;\">\n    <div class=\"esim-prevnext\" style=\"max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n      <a href=\"{{ prevHref }}\" style=\"display:flex; flex-direction:column; gap:6px; background:#F7F9F8; border:1px solid #E9EEEB; border-radius:16px; padding:26px 28px; text-decoration:none;\" style-hover=\"border-color:#0E7A3A;\">\n        <span style=\"font-size:13px; font-weight:700; color:#9AA2AA; letter-spacing:0.04em;\">← TRABAJO ANTERIOR<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#14181C;\">{{ prevTitle }}<\u002Fspan>\n      <\u002Fa>\n      <a href=\"{{ nextHref }}\" style=\"display:flex; flex-direction:column; gap:6px; align-items:flex-end; text-align:right; background:#F7F9F8; border:1px solid #E9EEEB; border-radius:16px; padding:26px 28px; text-decoration:none;\" style-hover=\"border-color:#0E7A3A;\">\n        <span style=\"font-size:13px; font-weight:700; color:#9AA2AA; letter-spacing:0.04em;\">TRABAJO SIGUIENTE →<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#14181C;\">{{ nextTitle }}<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#14181C; padding:54px 6vw 38px; color:#fff;\">\n    <div style=\"max-width:1240px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;\">\n      <span style=\"display:inline-flex; background:#fff; border-radius:10px; padding:9px 13px;\"><img src=\"0909e230-255e-4405-a36e-145648bf962b\" alt=\"ESIM SRL\" style=\"height:30px; width:auto; display:block;\"><\u002Fspan>\n      <span style=\"font-size:14px; color:#6B747C;\">© {{ year2 }} ESIM SRL · Servicios industriales para Oil &amp; Gas<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeLightbox }}\" style=\"position:fixed; inset:0; z-index:200; background:rgba(8,11,14,0.92); display:flex; align-items:center; justify-content:center; padding:5vh 5vw; cursor:zoom-out;\">\n      {{ lightboxEl }}\n      <span style=\"position:fixed; top:24px; right:30px; color:#fff; font-size:34px; font-weight:300; line-height:1; cursor:pointer;\">×<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { lightboxImg: null };\n\n  PROJECTS = {\n    ductos: {\n      title: \"Acondicionamiento de ductos\",\n      category: \"Logística & Obra\",\n      client: \"YPF · Poliductos\",\n      location: \"Patagonia\",\n      year: \"2024\",\n      paras: [\n        \"Intervención integral de cañerías y poliductos en obra: desde la apertura de zanja hasta la puesta en servicio. Trabajo nocturno y diurno con logística de equipos y personal especializado.\",\n        \"La soldadura se ejecuta bajo carpa para control de condiciones, con ensayos no destructivos y revestimiento de protección antes de la bajada y tapada de la línea.\"\n      ],\n      scope: [\"Excavación y preparación de zanja\", \"Soldadura y ensayos no destructivos (END)\", \"Revestimiento y protección anticorrosiva\", \"Bajada, tapada y puesta en servicio\"],\n      imgs: [\"images/hero.jpg\",\"images/p/ductos-1.jpg\",\"images/p/ductos-2.jpg\",\"images/p/ductos-3.jpg\",\"images/p/ductos-4.jpg\",\"images/p/ductos-5.jpg\",\"images/p/ductos-6.jpg\"]\n    },\n    hidrogrua: {\n      title: \"Logística e izaje con hidrogrúa\",\n      category: \"Logística pesada\",\n      client: \"Clientes varios\",\n      location: \"Cuyo y Patagonia\",\n      year: \"2024\",\n      paras: [\n        \"Servicio de transporte, carga y descarga de equipos pesados con camiones hidrogrúa y personal habilitado, en yacimiento y en planta.\",\n        \"Planificamos cada maniobra de izaje considerando peso, radio y condiciones del terreno para garantizar una operación segura y sin daños al equipo.\"\n      ],\n      scope: [\"Transporte de equipos y estructuras\", \"Maniobras de izaje con hidrogrúa\", \"Carga y descarga en obra\", \"Personal y equipos habilitados\"],\n      imgs: [\"images/p/hidrogrua-1.jpg\",\"images/p/hidrogrua-2.jpg\",\"images/p/hidrogrua-3.jpg\",\"images/p/hidrogrua-4.jpg\",\"images/p/hidrogrua-5.jpg\"]\n    },\n    bomba: {\n      title: \"Reparación de bomba B8 — YPF Poliducto\",\n      category: \"Equipos rotativos\",\n      client: \"YPF Poliducto\",\n      location: \"Argentina\",\n      year: \"2024\",\n      paras: [\n        \"Desarme, inspección dimensional, ajuste y montaje de bomba B8 de poliducto. Diagnóstico de componentes y reemplazo de partes según especificación.\",\n        \"El trabajo se completó cumpliendo tolerancias de precisión y protocolos de prueba para devolver el equipo a operación en el menor tiempo posible.\"\n      ],\n      scope: [\"Desarme e inspección dimensional\", \"Mecanizado y ajuste de componentes\", \"Reemplazo de partes y sellos\", \"Montaje, alineación y pruebas\"],\n      imgs: [\"images/p/bomba-1.jpg\",\"images/p/bomba-2.jpg\",\"images/p/bomba-3.jpg\",\"images/p/bomba-4.jpg\"]\n    },\n    compresor: {\n      title: \"Mantenimiento de compresor — Air Liquide\",\n      category: \"Equipos rotativos\",\n      client: \"Air Liquide\",\n      location: \"Planta industrial\",\n      year: \"2024\",\n      paras: [\n        \"Intervención de mantenimiento sobre compresor en planta, con trabajo en altura y sobre el equipo bajo procedimientos de seguridad.\",\n        \"Inspección, ajuste y verificación de componentes para asegurar la continuidad operativa del sistema de compresión.\"\n      ],\n      scope: [\"Inspección y diagnóstico en planta\", \"Ajuste de componentes\", \"Trabajo en altura bajo procedimiento\", \"Verificación y puesta en marcha\"],\n      imgs: [\"images/p/compresor-1.jpg\",\"images/p/compresor-2.jpg\"]\n    },\n    motor: {\n      title: \"Reparación de motor Cooper Superior\",\n      category: \"Equipos rotativos\",\n      client: \"Yacimiento Malargüe\",\n      location: \"Malargüe, Mendoza\",\n      year: \"2024\",\n      paras: [\n        \"Reparación de motor Cooper Superior en taller: desarme de camisas y pistones, inspección de componentes y armado de precisión.\",\n        \"Cada pieza se verifica y se ajusta para devolver el motor a sus condiciones de operación, con control de tolerancias en todo el proceso.\"\n      ],\n      scope: [\"Desarme de camisas y pistones\", \"Inspección de componentes\", \"Mecanizado y ajuste\", \"Armado de precisión y prueba\"],\n      imgs: [\"images/p/motor-1.jpg\",\"images/p/motor-2.jpg\",\"images/p/motor-3.jpg\",\"images/p/motor-4.jpg\",\"images/p/motor-5.jpg\"]\n    },\n    td: {\n      title: \"Oficina técnica: modelado 3D y repuestos\",\n      category: \"Ingeniería\",\n      client: \"Clientes varios\",\n      location: \"Taller ESIM\",\n      year: \"2023–2024\",\n      paras: [\n        \"Relevamiento de piezas y modelado 3D para la fabricación de repuestos a medida cuando el original ya no se consigue en el mercado.\",\n        \"Combinamos ingeniería inversa, diseño asistido y fabricación para entregar repuestos compatibles y listos para montar.\"\n      ],\n      scope: [\"Relevamiento e ingeniería inversa\", \"Modelado 3D y planos\", \"Fabricación de repuestos a medida\", \"Control de calidad dimensional\"],\n      imgs: [\"images/p/td-1.jpg\",\"images/p/td-2.jpg\",\"images/p/td-3.jpg\",\"images/p/td-4.jpg\",\"images/p/td-5.jpg\",\"images/p/td-6.jpg\"]\n    }\n  };\n  ORDER = [\"ductos\",\"hidrogrua\",\"bomba\",\"compresor\",\"motor\",\"td\"];\n\n  getSlug() {\n    try {\n      const sp = new URLSearchParams(window.location.search);\n      const p = sp.get(\"p\");\n      if (p && this.PROJECTS[p]) return p;\n    } catch (e) {}\n    return \"ductos\";\n  }\n\n  renderVals() {\n    const slug = this.getSlug();\n    const proj = this.PROJECTS[slug];\n    const idx = this.ORDER.indexOf(slug);\n    const prevSlug = this.ORDER[(idx - 1 + this.ORDER.length) % this.ORDER.length];\n    const nextSlug = this.ORDER[(idx + 1) % this.ORDER.length];\n    const images = proj.imgs.map((src) => ({\n      open: () => this.setState({ lightboxImg: src }),\n      el: React.createElement(\"img\", {\n        src,\n        alt: proj.title,\n        style: { position: \"absolute\", inset: 0, width: \"100%\", height: \"100%\", objectFit: \"cover\" },\n      }),\n    }));\n    const heroImgEl = React.createElement(\"img\", {\n      src: proj.imgs[0],\n      alt: proj.title,\n      style: { position: \"absolute\", inset: 0, width: \"100%\", height: \"100%\", objectFit: \"cover\", objectPosition: \"center 45%\" },\n    });\n    const lightboxEl = this.state.lightboxImg\n      ? React.createElement(\"img\", {\n          src: this.state.lightboxImg,\n          alt: \"\",\n          style: { maxWidth: \"100%\", maxHeight: \"100%\", objectFit: \"contain\", borderRadius: \"10px\", boxShadow: \"0 30px 80px rgba(0,0,0,0.6)\" },\n        })\n      : null;\n    return {\n      title: proj.title,\n      category: proj.category,\n      client: proj.client,\n      location: proj.location,\n      year: proj.year,\n      year2: new Date().getFullYear(),\n      paras: proj.paras,\n      scope: proj.scope,\n      heroImgEl,\n      images,\n      prevHref: \"Trabajo.dc.html?p=\" + prevSlug,\n      nextHref: \"Trabajo.dc.html?p=\" + nextSlug,\n      prevTitle: this.PROJECTS[prevSlug].title,\n      nextTitle: this.PROJECTS[nextSlug].title,\n      lightboxOpen: !!this.state.lightboxImg,\n      lightboxEl,\n      closeLightbox: () => this.setState({ lightboxImg: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
